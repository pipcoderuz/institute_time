{% load static %}

<div class="navbar">
  <div class="navbar-left">
    <button class="toggle-btn mobile-toggle" id="mobileToggle">☰</button>
    <a class="logo-link" href="/">
      <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo">
      <h1 class="logo-title">pipcoder</h1>
    </a>
  </div>
  <div class="navbar-right">
    <div class="user-profile">
      <img id="userImage"
          src="{% if user.profile_image %}{{ user.profile_image.url }}{% else %}/media/profiles/default-avatar.png{% endif %}"
          alt="Avatar" class="user-avatar" />
        <ul id="userDropdown" class="dropdown-menu hidden">
          <li class="dropdown-header">Foydalanuvchi rollari</li>
          <li>
            <form method="post" action="{% url 'accounts:switch_role' %}">
              {% csrf_token %}
              <select name="role" onchange="this.form.submit()">
                {% for role in user.roles %}
                <option value="{{ role }}" {% if role == user.active_role %}selected{% endif %}>
                  {{ role|title }}
                </option>
                {% endfor %}
              </select>
            </form>
          </li>
          <li>
            <a href="{% url 'accounts:logout' %}">Logout</a>
          </li>
        </ul>
    </div>
  </div>
</div>
